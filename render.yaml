services:
  - type: web
    name: orbit-crm-frontend
    runtime: static
    repo: https://github.com/tanishqtiwari25/orbit-crm-frontend
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: NEXT_TELEMETRY_DISABLED
        value: '1'
    routes:
      - type: rewrite
        source: /api/*
        destination: https://orbit-crm-bpjg.onrender.com/api/*
      - type: rewrite
        source: /lead-form.js
        destination: https://orbit-crm-bpjg.onrender.com/lead-form.js
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
